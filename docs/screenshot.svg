<text y="299" style="white-space:pre"><tspan x="139.6" fill="#cdd3dc" >[vehshop_pro] resources/[leaks]/vehshop_pro/node_modules/.cache/babel_config.js:1</tspan></text>
<text y="318" style="white-space:pre"></text>
<text y="337" style="white-space:pre"><tspan x="30.4" fill="#e2615a" font-weight="bold" >HIGH</tspan><tspan x="80.8" fill="#7c8592" >FX012</tspan><tspan x="139.6" fill="#cdd3dc" >Known dropper file name</tspan></text>
<text y="356" style="white-space:pre"><tspan x="139.6" fill="#cdd3dc" >[vehshop_pro] resources/[leaks]/vehshop_pro/node_modules/.cache/babel_config.js:1</tspan></text>
