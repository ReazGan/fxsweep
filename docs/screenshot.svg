<svg xmlns="http://www.w3.org/2000/svg" width="699" height="834" viewBox="0 0 699 834">
<rect width="699" height="834" rx="8" fill="#1d2026"/>
<g fill="#3a3f48"><circle cx="20" cy="18" r="5"/><circle cx="38" cy="18" r="5"/><circle cx="56" cy="18" r="5"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text y="52" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >$ fxsweep server-data</tspan></text>
<text y="71" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" font-weight="bold" >fxsweep</tspan><tspan x="89.2" fill="#cdd3dc" >v0.1.0</tspan></text>
<text y="90" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >scanning server-data</tspan></text>
<text y="109" style="white-space:pre"></text>
<text y="128" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" font-weight="bold" >vehshop_pro</tspan><tspan x="131.2" fill="#7c8592" >resources/[leaks]/vehshop_pro</tspan></text>
<text y="147" style="white-space:pre"></text>
<text y="166" style="white-space:pre"><tspan x="38.8" fill="#e2615a" font-weight="bold" >HIGH</tspan><tspan x="89.2" fill="#cdd3dc" >Hidden script entry in manifest  </tspan><tspan x="366.4" fill="#7c8592" >FX010</tspan></text>
<text y="185" style="white-space:pre"><tspan x="89.2" fill="#cdd3dc" >fxmanifest.lua:4</tspan></text>
<text y="204" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >fxmanifest.lua loads a hidden file. A common trick is to comment out</tspan></text>
<text y="223" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >the real line and slip a hidden script onto the same line.</tspan></text>
<text y="242" style="white-space:pre"><tspan x="89.2" fill="#cdd3dc" >&#x27;node_modules/.cache/babel_config.js&#x27;</tspan></text>
<text y="261" style="white-space:pre"></text>
<text y="280" style="white-space:pre"><tspan x="38.8" fill="#e2615a" font-weight="bold" >HIGH</tspan><tspan x="89.2" fill="#cdd3dc" >Encoded payload  </tspan><tspan x="232.0" fill="#7c8592" >FX004</tspan></text>
<text y="299" style="white-space:pre"><tspan x="89.2" fill="#cdd3dc" >server.lua:1</tspan></text>
<text y="318" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >A long text written as escape codes so it cannot be read at a glance.</tspan></text>
<text y="337" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >fxsweep decoded it, see the line below. A web address or code here</tspan></text>
<text y="356" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >usually means a hidden backdoor.</tspan></text>
<text y="375" style="white-space:pre"><tspan x="89.2" fill="#cdd3dc" >https://example.invalid/i?to=vehshop_pro</tspan></text>
<text y="394" style="white-space:pre"></text>
<text y="413" style="white-space:pre"><tspan x="38.8" fill="#e2615a" font-weight="bold" >HIGH</tspan><tspan x="89.2" fill="#cdd3dc" >Downloads and runs remote code  </tspan><tspan x="358.0" fill="#7c8592" >FX002</tspan></text>
<text y="432" style="white-space:pre"><tspan x="89.2" fill="#cdd3dc" >server.lua:3</tspan></text>
<text y="451" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >Downloads code from the internet and runs it on your server. Backdoor</tspan></text>
<text y="470" style="white-space:pre"><tspan x="89.2" fill="#7c8592" >panels take over servers this way.</tspan></text>
<text y="489" style="white-space:pre"></text>
<text y="508" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" font-weight="bold" >What to do:</tspan><tspan x="139.6" fill="#cdd3dc" >Delete this resource and download it again from its original</tspan></text>
<text y="527" style="white-space:pre"><tspan x="139.6" fill="#cdd3dc" >author.</tspan></text>
<text y="546" style="white-space:pre"></text>
<text y="565" style="white-space:pre"></text>
<text y="584" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >3 resources, 9 files in 1ms</tspan></text>
<text y="603" style="white-space:pre"><tspan x="22.0" fill="#e2615a" font-weight="bold" >3 high, 0 medium, 0 low</tspan></text>
<text y="622" style="white-space:pre"></text>
<text y="641" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" font-weight="bold" >What to do now</tspan></text>
<text y="660" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" >1. Stop the server.</tspan></text>
<text y="679" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" >2. Remove the resources marked above. fxsweep -quarantine &lt;folder&gt; can move</tspan></text>
<text y="698" style="white-space:pre"><tspan x="64.0" fill="#cdd3dc" >the infected files out for you.</tspan></text>
<text y="717" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" >3. Change your txAdmin, database and Discord bot passwords and your Cfx.re</tspan></text>
<text y="736" style="white-space:pre"><tspan x="64.0" fill="#cdd3dc" >license key. The attacker could read all of them.</tspan></text>
<text y="755" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" >4. Check txAdmin&#x27;s admin list for accounts you did not add.</tspan></text>
<text y="774" style="white-space:pre"><tspan x="38.8" fill="#cdd3dc" >5. Download scripts only from their original authors. Leaked scripts are how</tspan></text>
<text y="793" style="white-space:pre"><tspan x="64.0" fill="#cdd3dc" >these backdoors spread.</tspan></text>
</g></svg>
